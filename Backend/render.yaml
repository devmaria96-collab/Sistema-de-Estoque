services:
- type: web
  name: estoques-ti-api
  runtime: python
  plan: free
  rootDir: Backend
  buildCommand: pip install -r requirements.txt
  startCommand: python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: API_TITLE
        value: Estoque TI API
      - key: API_VERSION
        value: 1.0.0
      - key: API_PREFIX
        value: /api
